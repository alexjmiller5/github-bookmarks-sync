name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The one GH secret: this project's 1Password service-account token (see
    # new-project skill). It authenticates op for BOTH reading the deploy creds
    # and pushing the Worker secrets — CI owns the full deploy, no manual sync.
    env:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: 1Password/install-cli-action@v4
      - uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          CLOUDFLARE_API_TOKEN: op://GitHub-Bookmarks-Sync/cloudflare/api-token
          CLOUDFLARE_ACCOUNT_ID: op://GitHub-Bookmarks-Sync/cloudflare/account-id
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      - run: bunx wrangler deploy
      # Secrets AFTER deploy — `wrangler secret put` needs the Worker to exist.
      # Delete this step + scripts/sync-secrets.sh if the site has no secrets.
      - name: Push Worker secrets
        run: ./scripts/sync-secrets.sh
