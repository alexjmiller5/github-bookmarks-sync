name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: extractions/setup-just@v3
      - run: bun install --frozen-lockfile
      - run: just check
      - run: just test
